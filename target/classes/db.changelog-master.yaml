# Liquibase master changelog (classpath root — reliable inside Spring Boot fat JAR).
# If `users` already exists (e.g. legacy Flyway schema), v1 is marked ran and skipped.
databaseChangeLog:
  - changeSet:
      id: v1-init-schema
      author: reviewtopper
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: users
      changes:
        - sqlFile:
            path: db/migration/V1__init_schema.sql
            relativeToChangelogFile: false
            stripComments: false
            splitStatements: true
            endDelimiter: ;
  - changeSet:
      id: v2-seed-reference-data
      author: reviewtopper
      changes:
        - sqlFile:
            path: db/migration/V2__seed_reference_data.sql
            relativeToChangelogFile: false
            stripComments: false
            splitStatements: true
            endDelimiter: ;
  - changeSet:
      id: v5-workspace-qr-feedback-visitor
      author: reviewtopper
      changes:
        - sqlFile:
            path: db/migration/V5__workspace_qr_and_feedback_visitor.sql
            relativeToChangelogFile: false
            stripComments: false
            splitStatements: true
            endDelimiter: ;
  - changeSet:
      id: v6-feedback-language
      author: reviewtopper
      changes:
        - sqlFile:
            path: db/migration/V6__feedback_language.sql
            relativeToChangelogFile: false
            stripComments: false
            splitStatements: true
            endDelimiter: ;
