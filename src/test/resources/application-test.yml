spring:
  datasource:
    url: jdbc:h2:mem:reviewtopper;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false

review-topper:
  jwt:
    secret: integration-test-secret-at-least-thirty-two-characters-long
  bootstrap:
    admin-email: admin-int@test.local
    admin-password: AdminTestOnly1!
