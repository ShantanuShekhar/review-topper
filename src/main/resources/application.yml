spring:
  application:
    name: review-topper-api
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/review_topper?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:mysql123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  liquibase:
    # Leading slash + root resource path — resolves reliably from BOOT-INF/classes in executable jars.
    change-log: classpath:/db.changelog-master.yaml
  ai:
    openai:
      api-key: ${OPENAI_API_KEY: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}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.75
          max-tokens: 180

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

review-topper:
  ai:
    enabled: ${AI_ENABLED:true}
    timeout-ms: ${AI_TIMEOUT_MS:1800}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-for-hs512}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  # Binds to ReviewTopperProperties.publicUrls
  public-urls:
    api-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8080}
    frontend-base-url: ${PUBLIC_FRONTEND_URL:http://localhost:5173}
  auth:
    # Production: keep false. Local E2E: SPRING_PROFILES_ACTIVE=dev (see application-dev.yml) or EXPOSE_RESET_TOKEN=true.
    expose-reset-token-in-response: ${EXPOSE_RESET_TOKEN:false}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@reviewtopper.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMeAdmin!1}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Platform Admin}

logging:
  level:
    root: INFO
    com.reviewtopper: INFO
    org.hibernate.SQL: WARN
