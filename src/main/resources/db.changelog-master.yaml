# Liquibase master changelog (classpath root — reliable inside Spring Boot fat JAR).
# If `users` already exists (e.g. legacy Flyway schema), v1 is marked ran and skipped.
databaseChangeLog:
  - changeSet:
      id: v1-init-schema
      author: reviewtopper
      # SQL updated for MariaDB (LONGTEXT JSON, b'1' bits) — accept prior checksum from deployed DBs.
      validCheckSum:
        - 9:9bc530092b097058f1f5b905cb4f9850
        - 9:3c1d4dad2a2d6e729087aba8464502f8
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: users
      changes:
        - sqlFile:
            path: db/migration/V1__init_schema.sql
            relativeToChangelogFile: false
            stripComments: false
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: v2-seed-reference-data
      author: reviewtopper
      validCheckSum:
