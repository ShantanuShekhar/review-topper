        sqlCheck:
          expectedResult: 1
          sql: |
            SELECT COUNT(*)
            FROM information_schema.COLUMNS
            WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'subscription_plans'
              AND COLUMN_NAME = 'features_json'
              AND UPPER(DATA_TYPE) = 'JSON'
